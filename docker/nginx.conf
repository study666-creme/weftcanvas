# Docker's resolver follows API address changes when its container is recreated.
upstream canvas_api {
  zone canvas_api 64k;
  server api:8787 resolve;
  resolver 127.0.0.11 valid=5s ipv6=off;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Same-origin product API, including SSE streams (buffering off, long timeouts).
  location /api/ {
    proxy_pass http://canvas_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # Operator pages are served by the API and authenticate through its secrets.
  # No X-Frame-Options here: the ops console iframes the model-override page from
  # the same origin, and the API pins the allowed ancestors itself.
  location /admin/ {
    proxy_pass http://canvas_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Browser-side security headers for the static app. This mirrors
  # apps/web/public/_headers (the Cloudflare Pages contract) exactly, so both
  # deployment shapes answer the same way; the e2e check compares the two sets.
  #
  # The CSP is deliberately minimal (base-uri / object-src / frame-ancestors /
  # form-action). script-src and connect-src stay open because BYOK talks to
  # user-configured relay endpoints, and the canvas pulls media, MediaPipe wasm
  # and Three.js assets from the same origin. Tightening them further needs a
  # browser pass over MediaPipe/Three.js/BYOK first — do not add restrictions
  # here without verifying those flows.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # HSTS only speaks up when TLS terminates in front of this container;
    # harmless on plain-HTTP loopback access.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
}
