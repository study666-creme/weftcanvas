# Docker's resolver follows API address changes when its container is recreated.
upstream canvas_api {
  zone canvas_api 64k;
  server api:8787 resolve;
  resolver 127.0.0.11 valid=5s ipv6=off;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Same-origin product API, including SSE streams (buffering off, long timeouts).
  location /api/ {
    proxy_pass http://canvas_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # Operator pages are served by the API and authenticate through its secrets.
  location /admin/ {
    proxy_pass http://canvas_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
