<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111212" />
    <link rel="icon" type="image/png" href="/kachang-logo-ui.png" />
    <link rel="apple-touch-icon" href="/kachang-logo-ui.png" />
    <title>卡藏画布</title>
    <script>
      // 与 src/lib/theme-schedule.ts 同一套规则：默认按时间自动（08:00 白天 /
      // 19:00 黑夜），用户手动切换过（manual）则粘住自选主题，不跟日程。
      // 引导脚本先行计算，避免 React 挂载前的闪色。
      try {
        const mode = localStorage.getItem("kachang-canvas:theme-mode");
        const stored = localStorage.getItem("kachang-canvas:theme");
        let theme = "dark";
        if (mode === "manual" && (stored === "dark" || stored === "light")) {
          theme = stored;
        } else {
          const hour = new Date().getHours();
          theme = hour >= 8 && hour < 19 ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
      // 首屏与登录页必须保流畅：无条件启用弱动效模式（静态英雄层、无星空/光晕/
      // 毛玻璃动画）。此前的运行时帧率采样要等首屏卡上 1 秒后才降级，弱机已经
      // 先卡完启动段；现在直接同步打标，登录页电影引擎也不再默认启动。
      document.documentElement.dataset.kcMotion = "lite";
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-width: 0;
        height: 100%;
        margin: 0;
      }

      html {
        color: #f0f1ef;
        background: #141515;
      }

      html[data-theme="light"] {
        color: #202422;
        background: #e7e8e5;
      }

      body {
        overflow: hidden;
        background: inherit;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }

      .kc-bootstrap-screen,
      .kc-startup-error {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        display: grid;
        overflow: hidden;
        --bs-ink: #f0f1ef;
        color: #f0f1ef;
        background: #141515;
      }

      html[data-theme="light"] :is(.kc-bootstrap-screen, .kc-startup-error) {
        --bs-ink: #202422;
        color: #202422;
        background: #e7e8e5;
      }

      .kc-bootstrap-screen {
        grid-template-rows: auto 1fr auto;
        padding: 40px 56px 36px;
      }

      .kc-bootstrap-brand {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        gap: 10px;
      }

      .kc-bootstrap-mark {
        display: grid;
        width: 30px;
        height: 30px;
        box-sizing: border-box;
        place-items: center;
        border: 1px solid color-mix(in srgb, var(--bs-ink) 10%, transparent);
        border-radius: 7px;
        overflow: hidden;
        background: color-mix(in srgb, var(--bs-ink) 5%, transparent);
      }

      .kc-bootstrap-mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .kc-bootstrap-brand > span:last-child,
      .kc-bootstrap-status > span:last-child {
        display: grid;
        gap: 3px;
      }

      .kc-bootstrap-brand strong,
      .kc-bootstrap-status strong {
        font-size: 12px;
        font-weight: 600;
        line-height: 1.2;
      }

      .kc-bootstrap-brand small,
      .kc-bootstrap-status small,
      .kc-bootstrap-meta,
      .kc-bootstrap-eyebrow {
        color: #858c88;
        font-size: 10px;
        line-height: 1.35;
      }

      .kc-bootstrap-content {
        display: grid;
        width: min(560px, 100%);
        margin: auto;
        justify-items: center;
        gap: 20px;
        text-align: center;
      }

      .kc-bootstrap-eyebrow {
        color: color-mix(in srgb, var(--bs-ink) 46%, transparent);
        font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", "SF Mono", Consolas, monospace;
        letter-spacing: .3em;
        text-transform: uppercase;
      }

      .kc-bootstrap-title-row {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 18px;
      }

      .kc-bootstrap-title-row h1 {
        margin: 0;
        font-size: clamp(30px, 4.6vw, 46px);
        font-weight: 280;
        letter-spacing: .12em;
        line-height: 1.15;
      }

      .kc-bootstrap-progress {
        position: relative;
        width: min(420px, 100%);
        height: 1px;
        overflow: hidden;
        background: color-mix(in srgb, var(--bs-ink) 12%, transparent);
      }

      .kc-bootstrap-progress::after {
        position: absolute;
        inset: 0;
        content: "";
        background: linear-gradient(90deg, transparent, var(--bs-ink), transparent);
        animation: kc-bootstrap-sweep 1.4s ease-in-out infinite;
      }

      .kc-bootstrap-status {
        display: flex;
        min-height: 32px;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .kc-bootstrap-status::before {
        width: 6px;
        height: 6px;
        flex: 0 0 6px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--bs-ink) 70%, transparent);
        content: "";
        animation: kc-bootstrap-pulse 900ms ease-in-out infinite alternate;
      }

      .kc-bootstrap-meta {
        display: flex;
        justify-content: center;
        gap: 10px;
        color: color-mix(in srgb, var(--bs-ink) 34%, transparent);
        font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", "SF Mono", Consolas, monospace;
        font-size: 9px;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      .kc-startup-error {
        place-items: center;
        padding: 24px;
      }

      .kc-startup-error > div {
        display: grid;
        width: min(420px, 100%);
        gap: 12px;
      }

      .kc-startup-error h1,
      .kc-startup-error p {
        margin: 0;
      }

      .kc-startup-error h1 {
        font-size: 22px;
        font-weight: 600;
      }

      .kc-startup-error p {
        color: #858c88;
        font-size: 12px;
        line-height: 1.6;
      }

      .kc-startup-error button {
        width: fit-content;
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid color-mix(in srgb, var(--bs-ink) 22%, transparent);
        border-radius: 8px;
        color: #f0f1ef;
        background: transparent;
        font: inherit;
        cursor: pointer;
      }

      @keyframes kc-bootstrap-sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(100%); }
      }

      @keyframes kc-bootstrap-pulse {
        from { opacity: .45; }
        to { opacity: 1; }
      }

      @media (max-width: 760px) {
        .kc-bootstrap-screen { padding: 24px 22px 26px; }
        .kc-bootstrap-content { margin-bottom: 14vh; }
        .kc-bootstrap-title-row h1 { font-size: 24px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .kc-bootstrap-progress::after,
        .kc-bootstrap-status::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <section class="kc-bootstrap-screen" role="status" aria-label="正在打开卡藏画布" aria-busy="true">
        <header class="kc-bootstrap-brand">
          <span class="kc-bootstrap-mark"><img src="/kachang-logo-ui.webp" alt="" aria-hidden="true" /></span>
          <span><strong>卡藏画布</strong><small>Kachang Canvas</small></span>
        </header>
        <div class="kc-bootstrap-content">
          <span class="kc-bootstrap-eyebrow">工作区 / 启动画布</span>
          <div class="kc-bootstrap-title-row"><h1>正在打开画布</h1></div>
          <div class="kc-bootstrap-progress" role="progressbar" aria-label="画布启动进度"></div>
          <div class="kc-bootstrap-status">
            <span><strong>载入画布运行时</strong><small>正在准备本地项目与创作能力</small></span>
          </div>
        </div>
        <footer class="kc-bootstrap-meta"><span>本地工作区</span><span>正在连接</span></footer>
      </section>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
