name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # PostgreSQL 集成测试此前在 CI 里静默跳过（CANVAS_TEST_DATABASE_URL 未设置，
    # describe.skipIf 直接跳过 25 条）。这里起一个一次性实例，把
    # identity / generation / media / 限流 / 对账的库层回归真正跑起来。
    # 注意：URL 只在下面的 test:postgres 步骤注入——那里的 --maxWorkers=1 串行
    # 跑迁移。放到作业级会让 pnpm test 以默认并行度跑集成文件，多个文件同时
    # 抢迁移锁（"Another Canvas migration process already holds the migration
    # lock"）——首版 CI 就是这样失败的，别改回去。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: canvas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canvas -d canvas_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 固定（pnpm@11.7.0）；这里不能再写
      # version，否则 pnpm/action-setup v4 会因"指定了多个版本"直接失败。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # 库名必须含 test（集成测试自带保险）。串行（--maxWorkers=1）跑迁移。
      - name: PostgreSQL integration tests
        run: pnpm --filter @weftcanvas/canvas-api test:postgres
        env:
          CANVAS_TEST_DATABASE_URL: postgresql://canvas:ci-only-database-password@127.0.0.1:5432/canvas_test?sslmode=disable
      # 本机 Blender 桥接的认证回归：不需要 Blender，用 bpy 替身直接打 TCP 端口
      # （无令牌/错令牌要在进入执行队列前被拒绝；非回环绑定必须拒绝）。
      - name: Blender bridge auth regression
        run: python3 apps/agent/blender/bridge_auth_test.py
      - run: pnpm build

      - run: pnpm --filter @weftcanvas/canvas-web exec playwright install --with-deps chromium
      - name: Browser smoke (local fixtures, no paid calls)
        run: >-
          pnpm --filter @weftcanvas/canvas-web exec playwright test
          e2e/custom-api.spec.ts
          e2e/project-persistence.spec.ts
          e2e/project-backup.spec.ts
          e2e/plugin-split-list.spec.ts
      - name: Browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-results/playwright/
          if-no-files-found: ignore

  self-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-database-password
      IDENTITY_SESSION_SECRET: ci-only-session-secret-at-least-thirty-two-bytes
      MODEL_OVERRIDES_ADMIN_SECRET: ci-only-admin-secret
    steps:
      - uses: actions/checkout@v4
      - name: Build and start isolated self-host stack
        run: docker compose --project-name weftcanvas-ci up --build -d --wait --wait-timeout 180
      - name: Check API and operator proxy
        run: |
          curl --fail --silent --show-error --retry 5 http://127.0.0.1:8080/api/health
          curl --fail --silent --show-error http://127.0.0.1:8080/admin/ops --output /tmp/weftcanvas-ci-ops.html
          grep -q '<title>画布运营后台</title>' /tmp/weftcanvas-ci-ops.html
      - name: Check persistence and shared worker volume
        run: |
          docker compose --project-name weftcanvas-ci exec -T api node -e "require('node:fs').mkdirSync('.data/media-objects',{recursive:true});require('node:fs').writeFileSync('.data/media-objects/ci-marker','persisted')"
          docker compose --project-name weftcanvas-ci up -d --force-recreate --wait api
          docker compose --project-name weftcanvas-ci exec -T api node -e "if(require('node:fs').readFileSync('.data/media-objects/ci-marker','utf8')!=='persisted')process.exit(1)"
          docker compose --project-name weftcanvas-ci run --rm --no-deps --entrypoint node worker -e "if(require('node:fs').readFileSync('.data/media-objects/ci-marker','utf8')!=='persisted')process.exit(1)"
          curl --fail --silent --show-error --retry 5 http://127.0.0.1:8080/api/ready
      - name: Stack diagnostics
        if: failure()
        run: docker compose --project-name weftcanvas-ci logs --no-color
      - name: Remove CI stack
        if: always()
        run: docker compose --project-name weftcanvas-ci down --volumes

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 公共仓库免费；组织账号需要在仓库 secrets 里提供 GITLEAKS_LICENSE。
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
